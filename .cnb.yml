# ============================================================
# 云原生构建（CNB）流水线
#
# 四条链路，都是为了「改动一进仓库就有机器替你把关」：
#   1. main push            → 质量门禁（前端构建 + 类型检查 + Rust 单测）
#   2. Pull Request         → 同一套门禁，作为合入前的检查
#   3. api_trigger_release  → 在 main 上手动跑一次完整发布链路（不打 tag 也能验）
#   4. tag push             → 发布链路：门禁 + 打包 Linux 安装包 + 校验产物
#
# 为什么发布产物是 Linux deb：
# CNB Runner 是 Linux 容器，出不了 macOS 的 .app/.dmg。deb 的价值在于把
# 「前端构建 → Rust 编译 → 打安装包 → 版本号/产物完整性校验」整条链路跑通；
# 真正给 macOS 用的安装包仍在 mac 上 `pnpm desktop:build` 产出。
#
# 缓存策略：
# /root/.rustup、/root/.cargo、/root/.local/share/pnpm 挂 copy-on-write 数据卷。
# 首次跑要装工具链，之后命中缓存，准备阶段从分钟级降到十来秒。
# PR 用的卷是只读版（copy-on-write-read-only），避免外部 PR 污染缓存。
# ============================================================

# 全局环境变量：让 Rust 报错在 CI 日志里可读，失败时能直接看到 backtrace
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

main:
  push:
    - name: gate
      docker: &ci-docker
        image: node:22-bookworm
        volumes:
          - /root/.rustup:copy-on-write
          - /root/.cargo:copy-on-write
          - /root/.local/share/pnpm:copy-on-write
      stages:
        - name: prepare environment
          script: bash ci/setup.sh
        - name: build and test
          script: bash ci/test.sh
      failStages:
        - name: report failure
          script: echo "质量门禁未通过：请按上方失败阶段的日志修复后重新提交"

  pull_request:
    - name: pr-gate
      # 与 push 同一套环境，但缓存卷只读：PR（可能是外部贡献）不能写坏缓存
      docker:
        image: node:22-bookworm
        volumes:
          - /root/.rustup:copy-on-write-read-only
          - /root/.cargo:copy-on-write-read-only
          - /root/.local/share/pnpm:copy-on-write-read-only
      stages:
        - name: prepare environment
          script: bash ci/setup.sh
        - name: build and test
          script: bash ci/test.sh

  # 手动跑一次门禁：cnb build start-build --event api_trigger_check --branch main
  api_trigger_check:
    - name: manual-gate
      docker: *ci-docker
      stages:
        - name: prepare environment
          script: bash ci/setup.sh
        - name: build and test
          script: bash ci/test.sh

  # 手动跑完整发布链路（不打 tag 也能验证）：--event api_trigger_release
  # 与 tag 发布唯一的区别是跳过「tag 名 == 版本号」的一致性校验
  api_trigger_release:
    - name: manual-release
      docker: *ci-docker
      stages: &release-stages
        - name: prepare environment
          script: bash ci/setup.sh
        - name: build and test
          script: bash ci/test.sh
        - name: build desktop bundle
          script: bash ci/release.sh
      failStages:
        - name: report failure
          script: echo "发布测试未通过：产物未生成或校验失败，详见上方失败阶段"

# 「$」为兜底分支键：tag 不属于任何分支，用兜底匹配接住所有 tag
$:
  tag_push:
    - name: release
      docker: *ci-docker
      stages: *release-stages
      failStages:
        - name: report failure
          script: echo "版本发布测试未通过：产物未生成或校验失败，详见上方失败阶段"
