# ============================================================
# 云原生构建（CNB）流水线
#
# 四条链路，都是为了「改动一进仓库就有机器替你把关」：
#   1. main push            → 质量门禁（前端构建 + 类型检查 + Rust 单测）
#   2. Pull Request         → 同一套门禁，作为合入前的检查
#   3. api_trigger_release  → 手动完整发布：Linux deb + macOS .app/.dmg（不打 tag 也能验）
#   4. tag push             → 发布链路：门禁 + 打包 Linux deb + macOS 应用 + 校验产物
#
# macOS 产物跑在根组织的自建 Mac 节点上（runner.namespace: group + tags 匹配）。
# 自建节点限制（CNB 文档）：脚本直接跑在宿主机上——docker.image 不生效、
# runner.cpus 无效，环境靠 ci/mac-setup.sh 在宿主机就地检查补装；
# 也因此不声明 volumes（宿主 HOME 持久，工具链与缓存天然复用）。
#
# 缓存策略（Linux 容器侧）：
# /root/.rustup、/root/.cargo、/root/.local/share/pnpm 挂 copy-on-write 数据卷。
# 首次跑要装工具链，之后命中缓存，准备阶段从分钟级降到十来秒。
# PR 用的卷是只读版（copy-on-write-read-only），避免外部 PR 污染缓存。
# ============================================================

# 全局环境变量：让 Rust 报错在 CI 日志里可读，失败时能直接看到 backtrace
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

main:
  push:
    - name: gate
      docker: &ci-docker
        image: node:22-bookworm
        volumes:
          - /root/.rustup:copy-on-write
          - /root/.cargo:copy-on-write
          - /root/.local/share/pnpm:copy-on-write
      stages:
        - name: prepare environment
          script: bash ci/setup.sh
        - name: build and test
          script: bash ci/test.sh
      failStages:
        - name: report failure
          script: echo "质量门禁未通过：请按上方失败阶段的日志修复后重新提交"

  pull_request:
    - name: pr-gate
      # 与 push 同一套环境，但缓存卷只读：PR（可能是外部贡献）不能写坏缓存
      docker:
        image: node:22-bookworm
        volumes:
          - /root/.rustup:copy-on-write-read-only
          - /root/.cargo:copy-on-write-read-only
          - /root/.local/share/pnpm:copy-on-write-read-only
      stages:
        - name: prepare environment
          script: bash ci/setup.sh
        - name: build and test
          script: bash ci/test.sh

  # 手动跑一次门禁：cnb build start-build --event api_trigger_check --branch main
  api_trigger_check:
    - name: manual-gate
      docker: *ci-docker
      stages:
        - name: prepare environment
          script: bash ci/setup.sh
        - name: build and test
          script: bash ci/test.sh

  # 手动跑完整发布链路（不打 tag 也能验证）：--event api_trigger_release
  # 与 tag 发布唯一的区别是跳过「tag 名 == 版本号」的一致性校验。
  # 同一事件声明两条流水线：Linux 容器出 deb、自建 Mac 节点出 .app/.dmg，
  # 两条并行跑，互不阻塞（各自失败各自上报）。
  api_trigger_release:
    - name: manual-release-linux
      docker: *ci-docker
      stages: &release-stages
        - name: prepare environment
          script: bash ci/setup.sh
        - name: build and test
          script: bash ci/test.sh
        - name: build desktop bundle
          script: bash ci/release.sh
      failStages:
        - name: report failure
          script: echo "Linux 发布测试未通过：产物未生成或校验失败，详见上方失败阶段"

    - name: manual-release-mac
      runner:
        # 自建节点必须同时给出 namespace 与 tags：
        # namespace=group 表示在当前仓库根组织下调度，tags 是节点标签的子集
        namespace: group
        tags:
          - mac
          - arm64
      stages: &mac-release-stages
        # Mac 节点没有容器环境，每步都要先自备工具链与依赖
        - name: prepare mac environment
          script: bash ci/mac-setup.sh
        - name: build mac app
          script: bash ci/mac-build.sh
      failStages:
        - name: report failure
          script: echo "macOS 发布测试未通过：产物未生成或校验失败，详见上方失败阶段"

# 「$」为兜底分支键：tag 不属于任何分支，用兜底匹配接住所有 tag
$:
  tag_push:
    # 正式发布：Linux deb 与 macOS 应用并行构建，均含「tag 名 == 版本号」校验
    - name: release-linux
      docker: *ci-docker
      stages: *release-stages
      failStages:
        - name: report failure
          script: echo "Linux 版本发布测试未通过：产物未生成或校验失败，详见上方失败阶段"

    - name: release-mac
      runner:
        namespace: group
        tags:
          - mac
          - arm64
      stages: *mac-release-stages
      failStages:
        - name: report failure
          script: echo "macOS 版本发布测试未通过：产物未生成或校验失败，详见上方失败阶段"
