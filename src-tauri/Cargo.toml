[package]
name = "app"
version = "0.1.3"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
# 全局快捷键：应用失焦也能响应（触发后呼出托盘弹窗）
tauri-plugin-global-shortcut = "2"
# 开机自启：登录系统后自动运行（托盘应用常驻）
tauri-plugin-autostart = "2"
# 读取 VS Code 的 state.vscdb（SQLite）；bundled 自带 SQLite，免系统依赖
rusqlite = { version = "0.37", features = ["bundled"] }
# 原生目录选择对话框（添加项目时浏览目录）
tauri-plugin-dialog = "2"

# macOS：直接访问 NSStatusItem / NSScreen，取托盘图标的权威位置，
# 解决多显示器混合缩放下按几何推算定位弹窗失效的问题
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSButton",
  "NSControl",
  "NSCell",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSScreen",
] }
# 与 tao 一致：主屏 CG 高度用于「下左原点 → 上左原点」的 Y 轴翻转
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGDirectDisplay",
] }
# MainThreadMarker：确保闭包在主线程执行
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSThread",
] }
