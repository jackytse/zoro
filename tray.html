<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>最近项目</title>
    <script>
      // 与主窗口一致：首屏渲染前同步主题，避免深色模式下闪白
      try {
        var mode = localStorage.getItem("vueuse-color-scheme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (mode === "dark" || (mode !== "light" && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch (error) {
        // localStorage 不可用时退化为浅色
      }
    </script>
  </head>
  <body>
    <div id="tray"></div>
    <script type="module" src="/src/tray/main.ts"></script>
  </body>
</html>
